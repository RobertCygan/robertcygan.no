  n(count("auto_unconfirmed"), "automatisk STOPP ikke bekreftet", "automatiske STOPP ikke bekreftet");
  n(count("corrected"), "korrigert tid", "korrigerte tider");
  n(count("added"), "dag lagt til i etterkant", "dager lagt til i etterkant");
  n(count("missing"), "dag uten registrering", "dager uten registrering");
  n(count("short"), "dag kortere enn normtiden", "dager kortere enn normtiden");
  n(count("long"), "dag over 12 timer", "dager over 12 timer");
  if (st.state === "returned") parts_.push(`«${st.last.comment}»`);
  if (st.revoked) parts_.push(`Godkjenning angret: «${st.last.comment}»`);
  return parts_.length ? parts_.join(" · ") : "Ingen avvik";
}
function submitBlocker(emp, period, rep, st) {
  if (rep.rows.some((r) => r.flags.includes("auto_unconfirmed"))) return "Den ansatte må bekrefte eller korrigere automatisk STOPP først.";
  const lastWork = daysOf(period).filter((d) => norm(emp, d) > 0).at(-1) ?? daysOf(period).at(-1);
  if (TODAY < lastWork) return `Måneden kan sendes fra ${dayText(lastWork)}.`;
  if (rep.rows.some((r) => r.flags.includes("missing"))) return "Dager uten registrering må fylles ut først: legg til tid eller registrer fravær (for eksempel avspasering).";
  if (st.state === "submitted" && !st.stale) return "Måneden er sendt og venter på lederen.";
  if (st.state === "approved" && !st.stale) return "Måneden er godkjent.";
  return null;
}

function calendarLine(e, rep) {

  for (const q of PERIODS) for (const [iso, d] of Object.entries(e.months[q].days)) {

}

// ---------------------------------------------------------------- the month as a calendar
const CAL_ABS = {
  ferie: ["c-ferie", "Ferie", ""], avspasering_fleksitid: ["c-avsp", "Avspasering fleksitid", "fra fleksitiden"],
  permisjon_med_lonn: ["c-perm", "Permisjon med lønn", ""], permisjon_uten_lonn: ["c-permu", "Permisjon uten lønn", ""],
  sykefravaer_egenmelding: ["c-syk", "Sykefravær", "egenmelding"], sykefravaer_legeerklaering: ["c-syk", "Sykefravær", "legeerklæring"],
  sykt_barn: ["c-syk", "Sykt barn", ""], tjenestereise: ["", "Tjenestereise", ""],
};
const fc = (m) => (m > 0 ? "pos" : m < 0 ? "neg" : "muted");
function isoWeek(iso) {
  const { y, m, d } = parts(iso), t = new Date(Date.UTC(y, m - 1, d));
  t.setUTCDate(t.getUTCDate() + 3 - ((t.getUTCDay() + 6) % 7)); // the Thursday of the same week
  const jan4 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((t - jan4) / 86400000 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
}
const otMinutes = (o) => { const [a, b] = span(o.from, o.to); return b - a; };
function calDay(e, r, ots) {
  const rec = r.rec || {}, f = r.flags, abs = r.absence ? CAL_ABS[r.absence] : null, hol = holiday(r.iso);
  const off = !r.n && !r.session && !r.absence;
  let cls = "day";
  if (r.before) cls += " before";
  else if (f.includes("missing")) cls += " missing";
  else if (f.includes("auto_unconfirmed")) cls += " alarm";
  else if (f.includes("short")) cls += " short";
  else if (abs && abs[0]) cls += ` ${abs[0]}`;
  else if (off) cls += " off";
  if (r.iso > TODAY && !r.absence && !r.session) cls += " future";
  if (r.iso === TODAY) cls += " today";
  if (ui.pick === r.iso) cls += " selected";
  const tags = [f.includes("corrected") ? `<span class="tag k">K</span>` : "", f.includes("added") ? `<span class="tag k">+</span>` : "",
    f.includes("auto_confirmed") ? `<span class="tag a">A</span>` : "", f.includes("auto_unconfirmed") ? `<span class="tag r">A</span>` : "",
    f.includes("long") ? `<span class="tag k">12+</span>` : ""].join("");
  const lines = [], said = [];
  if (r.before) { lines.push(`<span class="sub">Før start</span>`); said.push("før start i FlexiT"); }
  if (hol) { lines.push(`<span class="sub">${hol}</span>`); said.push(hol); }
  else if (off && isWeekday(r.iso) && !r.before) { lines.push(`<span class="sub">Fri, ikke arbeidsdag</span>`); said.push("ikke arbeidsdag"); }
  if (r.session) { lines.push(`<span class="t">${rec.start}–${rec.stop}</span>`); said.push(`${rec.start} til ${rec.stop}, arbeidet ${hm(r.w)}`); }
  if (f.includes("short")) { lines.push(`<span class="under">Under normtid</span>`); said.push("kortere enn normtiden"); }
  if (abs) { lines.push(`<span class="label">${abs[1]}</span>`); if (abs[2]) lines.push(`<span class="sub">${abs[2]}</span>`); said.push(ABSENCES[r.absence]); }
  if (f.includes("missing")) { lines.push(`<span class="under">Ingen registrering</span><span class="sub">må fylles ut</span>`); said.push("ingen registrering, må løses"); }
  if (f.includes("auto_unconfirmed")) { lines.push(`<span class="under">STOPP ikke bekreftet</span>`); said.push("automatisk STOPP ikke bekreftet"); }
  for (const o of ots) { const kind = o.kind === "overtid_reise" ? "Reise" : "Overtid"; lines.push(`<span class="ot">${kind} ${hm(otMinutes(o))}</span>`); said.push(`${kind.toLowerCase()} ${o.from} til ${o.to}`); }
  const credited = r.absence && NORM_CREDIT.has(r.absence) && r.flex === 0 && r.n > 0;

function overtimeClash(e, p, date, from, to) {
  const [a, b] = span(from, to), rec = e.months[p].days[date];
  if (rec && rec.start && rec.stop && overlaps(a, b, ...span(rec.start, rec.stop))) return "Overtiden overlapper registrert arbeidstid den dagen. Overtid telles aldri også som fleksitid.";
  if (e.months[p].overtime.some((o) => o.date === date && overlaps(a, b, ...span(o.from, o.to)))) return "Overtiden overlapper en annen overtidsregistrering.";
  return null;
}
function parseFlex(text) {
  const m = /^\s*(-|−)?\s*(\d{1,3})(?::(\d{2}))?\s*$/.exec(text);
  if (!m || Number(m[3] || 0) > 59) return null;
  const v = Number(m[2]) * 60 + Number(m[3] || 0);
  return v > 12000 ? null : (m[1] ? -v : v);
}

const val = (id) => document.getElementById(id)?.value ?? "";

document.addEventListener("click", (ev) => {

    case "reset": state = seedState(); save(); Object.assign(ui, { confirmReset: false, filter: null, msg: "Eksempeldataene er lastet inn på nytt." }); render(); return;
    case "approve": {
      const rep = report(e, p); if (!canDecide(status(e, p, rep))) return;
      e.months[p].actions.push({ kind: "approve", by: LEADER, at: stamp(), snap: rep.snap });
      changed("Måneden er godkjent og kan gå videre til lønn."); render("decision-msg"); return;
    }
    case "return": {
      const comment = val("kommentar").trim(); if (comment.length < 3) return;
      e.months[p].actions.push({ kind: "return", by: LEADER, at: stamp(), comment });
      changed("Måneden er sendt tilbake med kommentaren din. Den ansatte retter og sender på nytt."); render("decision-msg"); return;
    }
    case "submit": {
      const rep = report(e, p); if (submitBlocker(e, p, rep, status(e, p, rep))) return;
      e.months[p].actions.push({ kind: "submit", by: e.id, at: stamp(), snap: rep.snap });
      changed(`Simulert: ${e.id} har sendt ${monthName(p)} til godkjenning.`); render("decision-msg"); return;
    }
    case "confirm-auto":
      Object.values(e.months[p].days).forEach((d) => { if (d.auto === "unconfirmed") d.auto = "confirmed"; });
      changed(`Simulert: ${e.id} har bekreftet automatisk STOPP.`); render("decision-msg"); return;
    case "edit": ui.edit = t.dataset.day; ui.pick = t.dataset.day; ui.editErr = null; render("edh"); document.getElementById("editor")?.scrollIntoView({ block: "nearest" }); return;
    case "ed-cancel": { const day = ui.edit; ui.edit = null; ui.editErr = null; render(dayAnchor(day)); return; }
    case "ed-clear": { const day = ui.edit; delete e.months[p].days[day]; ui.edit = null;
      changed(`Simulert: alt er fjernet ${dayText(day)}.`); ui.flash = dayAnchor(day); render(dayAnchor(day)); return; }
    case "ed-save": {
      const day = ui.edit, start = val("ed-start"), stop = val("ed-stop"), auto = val("ed-auto"), absence = val("ed-absence");
      const orig = val("ed-orig"), reason = val("ed-reason").trim(), added = document.getElementById("ed-added").checked, addedReason = val("ed-added-reason").trim();
      const err = (!start !== !stop) ? "Fyll inn både START og STOPP, eller ingen av dem."
        : start && start === stop ? "STOPP må være etter START."
        : auto && !stop ? "Automatisk STOPP krever en STOPP-tid."
        : orig && !start ? "Korrigert START krever en START-tid."
        : orig && reason.length < 3 ? "Skriv en begrunnelse for korrigeringen (minst 3 tegn)."
        : added && !start ? "Tid lagt til i etterkant krever START og STOPP."
        : added && addedReason.length < 3 ? "Skriv en begrunnelse for tiden som er lagt til (minst 3 tegn)."
        : added && orig ? "Tid som er lagt til i etterkant har ingen opprinnelig START å korrigere."
        : added && auto ? "Tid som er lagt til i etterkant har ingen automatisk STOPP."
        : start && worked({ start, stop }) > 16 * 60 ? "En økt kan være høyst 16 timer."
        : start && e.months[p].overtime.some((o) => o.date === day && overlaps(...span(start, stop), ...span(o.from, o.to)))
          ? "Arbeidstiden overlapper registrert overtid. Overtid telles aldri også som fleksitid." : null;
      if (err) { ui.editErr = err; render("ed-save"); return; }
      const rec = {};
      if (start) Object.assign(rec, { start, stop });
      if (auto) rec.auto = auto;
      if (absence) rec.absence = absence;
      if (orig) Object.assign(rec, { startOrig: orig, reason });
      if (added) rec.added = addedReason;
      if (Object.keys(rec).length) e.months[p].days[day] = rec; else delete e.months[p].days[day];
      ui.edit = null; ui.editErr = null;
      changed(`Simulert: ${e.id} har endret ${dayText(day)}.`); ui.flash = dayAnchor(day); render(dayAnchor(day)); return;
    }
    case "opening": {
      const start = val("op-start"), flex = parseFlex(val("op-flex")), vac = Number(val("op-vac"));
      if (!start || start < "2026-09-01" || start > TODAY) { ui.msg = { text: "Startdatoen må være mellom 1. september og 5. november 2026.", err: true }; render("decision-msg"); return; }
      if (flex === null) { ui.msg = { text: "Skriv fleksitiden som timer og minutter, for eksempel 12:40 eller -2:15.", err: true }; render("decision-msg"); return; }
      if (!(vac >= 0 && vac <= 60)) { ui.msg = { text: "Feriedager brukt før start må være mellom 0 og 60.", err: true }; render("decision-msg"); return; }
      e.start = start; e.opening = { flex, vacation: Math.round(vac) };
      if (start.slice(0, 7) !== p && start > daysOf(p).at(-1)) ui.period = start.slice(0, 7);
      changed(`Simulert: overførte timer er lagret (${flexText(flex)} per ${dateText(start)}). Saldoene regnes om.`); render("decision-msg"); return;
    }
    case "ot-add": {
      const o = { date: val("ot-date"), from: val("ot-from"), to: val("ot-to"), kind: val("ot-kind") || "overtid" };
      if (!o.date || !o.from || !o.to || o.from === o.to) { ui.msg = { text: "Velg dato og to ulike klokkeslett.", err: true }; render("decision-msg"); return; }
      const clash = overtimeClash(e, p, o.date, o.from, o.to);
      if (clash) { ui.msg = { text: clash, err: true }; render("decision-msg"); return; }
      e.months[p].overtime.push(o); e.months[p].overtime.sort((a, b) => (a.date + a.from).localeCompare(b.date + b.from));
      changed(`Simulert: overtid ${dayText(o.date)} ${o.from}–${o.to} er registrert.`); render("decision-msg"); return;
    }
    case "preset": t.dataset.week.split(",").forEach((m, i) => { const el_ = document.getElementById(`wk-${i}`); if (el_) el_.value = hm(Number(m)); }); return;
    case "schedule": {
      const week = [0, 1, 2, 3, 4].map((i) => parseFlex(val(`wk-${i}`)));
      if (week.some((m) => m === null || m < 0 || m > 720)) { ui.msg = { text: "Skriv arbeidstiden som timer og minutter mellom 0:00 og 12:00, for eksempel 7:45.", err: true }; render("decision-msg"); return; }
      e.schedule = week;
      changed(`Simulert: arbeidstiden er endret (${sharePercent(e)} %). Normen, saldoen og feriedagene regnes om.`); render("decision-msg"); return;
    }
    case "ot-del": e.months[p].overtime.splice(Number(t.dataset.i), 1); changed("Simulert: overtiden er fjernet."); render("decision-msg"); return;
  }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "show-all") { ui.showAll = t.checked; render("show-all"); }
  if (t.id === "nav-pick") { Object.assign(ui, { emp: t.value, edit: null, msg: null, editErr: null, revoke: false, pick: null }); render("nav-pick"); }
});
document.addEventListener("input", (ev) => {
  if (ev.target.id === "kommentar") document.getElementById("send-back").disabled = ev.target.value.trim().length < 3;
  if (ev.target.id === "revoke-reason") document.getElementById("revoke-yes").disabled = ev.target.value.trim().length < 3;
});
render();
</script>

</body></html>
