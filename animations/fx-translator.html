<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FxTranslator · Animasjon</title>
    <link rel="stylesheet" href="shared/player.css" />
    <link rel="stylesheet" href="shared/video.css" />
    <script src="shared/player.js?v=3" defer></script>
    <script src="shared/video.js?v=2" defer></script>
  </head>
  <body>
    <main class="preview" aria-label="FxTranslator">
      <video data-animation-video controls loop muted playsinline preload="none"
        poster="assets/fx-translator-promo-poster-v4.webp"
        aria-label="FxTranslator: oversettelse av Excel-funksjoner på tre språk">
        <source src="assets/fx-translator-promo-landscape-v4.mp4"
          data-preview-src="assets/fx-translator-promo-landscape-muted-v4.mp4" type="video/mp4" />
        <a href="assets/fx-translator-promo-landscape-v4.mp4">Last ned FxTranslator-presentasjonen</a>
      </video>
    </main>
    <div class="controls">
      <button type="button" id="motion" aria-pressed="false">Pause animasjon</button>
    </div>
  </body>
</html>
